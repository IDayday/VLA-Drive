# One conservative generator phase using a freshly trained frozen critic.
base_config: qwen_register64_clover_pdms_stage1.yaml
run_id: ${oc.env:CLOVER_GENERATOR_RUN_ID,qwen_register64_clover_pdms_refinement}
framework:
  name: QwenRegisterGenerator
generator_checkpoint: ${oc.env:REGISTER64_GENERATOR_CHECKPOINT}
candidate_bank:
  train_root: ${oc.env:REGISTER64_BANK_ROOT}/train
  val_root: ${oc.env:REGISTER64_BANK_ROOT}/val
scorer:
  checkpoint: ${oc.env:REGISTER64_DRIVOR_CHECKPOINT}
  model:
    scene_dim: 256
    ego_state_dim: 4
    model_dim: 256
    ffn_dim: 1024
    num_layers: 4
    num_heads: 1
    decoder_style: donor_register
    proj_drop: 0.1
    drop_path: 0.2
    layer_scale_init: 0.0
    dropout: 0.0
    noc: 1.0
    dac: 1.0
    ddc: 0.0
    ttc: 5.0
    ep: 5.0
    comfort: 2.0
    aggregate_head: true
    selection_mode: calibrated_hybrid
    aggregate_temperature: 1.0
    selection_alpha: 0.0
teacher_targets:
  topk: 8
  pareto_max_size: 8
  pareto_min_size: 2
  reward_threshold: 0.4
enrichment_gate:
  batch_size: 64
  num_workers: 4
  min_topk_enrichment: 0.0
  min_pareto_enrichment: 0.0
  min_topk_scene_ratio: 0.5
  min_pareto_scene_ratio: 0.5
loss:
  trajectory_weight: 0.1
  diversity_weight: 0.02
  topk_weight: 1.0
  pareto_weight: 1.0
  stability_weight: 0.05
optimizer:
  name: AdamW
  lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-3
  eps: 1.0e-8
  fused: true
scheduler:
  type: cosine
  warmup_ratio: 0.05
trainer:
  epochs: 1
  global_batch_size: 32
  gradient_accumulation_steps: 1
  gradient_clip: 1.0
