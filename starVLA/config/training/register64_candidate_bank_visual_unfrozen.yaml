# Stage B must reconstruct the same Qwen trainability manifest as the visual-
# unfrozen generator component checkpoint before strict loading.
base_config: register64_candidate_bank.yaml
run_id: register64_candidate_bank_visual_unfrozen

framework:
  qwenvl:
    freeze_visual: false
    visual_gradient_checkpointing: true

trainer:
  global_batch_size: 32
  freeze_modules: qwen_vl_interface.model.lm_head

optimizer:
  learning_rates:
    qwen_visual: 2.0e-6
