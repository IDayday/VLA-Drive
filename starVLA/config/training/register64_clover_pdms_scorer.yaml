# One critic phase. The launcher invokes this once per CLOVER cycle.
run_id: ${oc.env:CLOVER_SCORER_RUN_ID,register64_clover_pdms_scorer}
run_root_dir: ${oc.env:VLA_OUTPUT_ROOT,/mnt/zhangt_workspace/results/Checkpoints}
seed: 2
precision: bf16
training_profile:
  name: clover_pdms_value_bank_v1
  independent_from_stage_g: true
  donor:
    paper: "CLOVER: Closed-Loop Value Estimation and Ranking"
    repository: "https://github.com/WilliamXuanYu/CLOVER"
    revision: 6aba8b7b08a6b2cdba1ecee9325e51a544dd64c3
    reference_recipe:
      optimizer: AdamW
      learning_rate: 3.0e-5
      global_batch_size: 32
      cycles: 30
      critic_epochs_per_cycle: 1
      generator_epochs_per_cycle: 1
      starting_phase: scorer_fitting
  adaptation:
    aggregate_head: "DriveVLA-M0 direct PDM-value head"
    ranking_losses: "listwise plus hard-pair calibration for argmax regret"
candidate_bank:
  train_root: ${oc.env:REGISTER64_BANK_ROOT}/train
  val_root: ${oc.env:REGISTER64_BANK_ROOT}/val
  label_protocol: navsim_v1_1_pdms_two_way
model:
  scene_dim: 256
  ego_state_dim: 4
  model_dim: 256
  ffn_dim: 1024
  num_layers: 4
  num_heads: 1
  decoder_style: donor_register
  proj_drop: 0.1
  drop_path: 0.2
  layer_scale_init: 0.0
  dropout: 0.0
  dynamic_topm: 32
  noc: 1.0
  dac: 1.0
  ddc: 0.0
  ttc: 5.0
  ep: 5.0
  comfort: 2.0
  aggregate_head: true
  selection_mode: calibrated_hybrid
  aggregate_temperature: 1.0
  selection_alpha: 0.0
loss:
  type: pdms_value
  submetric_weight: 1.0
  aggregate_weight: 1.0
  listwise_weight: 1.0
  pairwise_weight: 0.5
  listwise_temperature: 0.1
  pairwise_temperature: 0.1
  pairwise_margin: 0.05
selector_calibration:
  grid_size: 21
initialize_from: ${oc.env:CLOVER_SCORER_INITIALIZE_FROM,null}
initialize_mode: weights_only
initialize_stage: ${oc.env:CLOVER_SCORER_INITIALIZE_STAGE,drivor_scorer}
optimizer:
  name: AdamW
  lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-3
  eps: 1.0e-8
  fused: true
scheduler:
  type: cosine
  warmup_ratio: 0.05
trainer:
  epochs: 1
  max_epochs: 1
  global_batch_size: 32
  gradient_accumulation_steps: 1
  gradient_clip: 1.0
  num_workers: ${oc.env:REGISTER64_BANK_LOADER_WORKERS,7}
  early_stopping:
    enabled: false
    patience: 2
    monitor: regret
    mode: min
