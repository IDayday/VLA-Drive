# R64-D / Stage S: bank-only donor-fidelity DrivoR scorer training.
run_id: register64_drivor_scorer
run_root_dir: ${oc.env:VLA_OUTPUT_ROOT,/mnt/zhangt_workspace/results/Checkpoints}
seed: 42
precision: bf16
training_profile:
  name: drivor_offline_bank_v1
  independent_from_stage_g: true
  donor:
    paper: "DrivoR: Driving on Registers"
    repository: "https://github.com/valeoai/DrivoR"
    revision: f02665403df799c1b4ddd8b0d34e073f0555c13a
    reference_recipe:
      optimizer: AdamW
      learning_rate: 2.0e-4
      global_batch_size: 64
      warmup_ratio: 0.10
      navsim_v2_epochs: 10
      navsim_v2_aggregate_weights:
        noc: 10.0
        dac: 13.0
        ddc: 6.0
        ttc: 14.0
        ep: 15.0
        comfort: 2.0
  adaptation:
    scope: frozen_register64_candidate_bank_scorer_only
    reason: "No image backbone or generator is optimized; use the required larger bank batch and select by validation regret."
candidate_bank:
  train_root: ${oc.env:REGISTER64_BANK_ROOT,/mnt/zhangt_workspace/register64_candidate_bank}/train
  val_root: ${oc.env:REGISTER64_BANK_ROOT,/mnt/zhangt_workspace/register64_candidate_bank}/val
model:
  scene_dim: 256
  ego_state_dim: 4
  model_dim: 256
  ffn_dim: 1024
  num_layers: 4
  num_heads: 1
  decoder_style: donor_register
  proj_drop: 0.1
  drop_path: 0.2
  layer_scale_init: 0.0
  dropout: 0.0
  dynamic_topm: 32
  # Released DrivoR NAVSIM-v2 selector aggregation. These weights are part of
  # the checkpoint/inference contract and must not fall back to the v1 PDMS
  # recipe (1/1/0/5/5/2).
  noc: 10.0
  dac: 13.0
  ddc: 6.0
  ttc: 14.0
  ep: 15.0
  comfort: 2.0
optimizer:
  name: AdamW
  lr: 2.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-3
  eps: 1.0e-8
  fused: true
scheduler:
  type: cosine
  warmup_ratio: 0.05
trainer:
  # Standalone default remains the requested 5-epoch bank ablation. The
  # complete DLC pipeline sets this to 10, matching the released v2 duration.
  epochs: ${oc.env:REGISTER64_DRIVOR_EPOCHS,5}
  max_epochs: 10
  global_batch_size: 256
  gradient_accumulation_steps: 1
  gradient_clip: 1.0
  # 16 ranks x (1 rank process + 7 workers) = all 128 DLC CPU slots.
  num_workers: ${oc.env:REGISTER64_BANK_LOADER_WORKERS,7}
  early_stopping:
    enabled: true
    patience: 2
    monitor: regret
    mode: min
