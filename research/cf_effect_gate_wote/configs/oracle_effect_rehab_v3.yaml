schema_version: cf_effect_wote_oracle_effect_rehab.v3
run:
  run_id: gate2o-matched-hybrid-rehab-v3
  seeds: [0, 1, 2]
  overwrite: false
data:
  train_scenes: 1024
  val_scenes: 256
  evaluation_scenes: 512
  evaluation_contract: original_test_200_712_development_only
  fresh_direct_holdout_used: false
  sealed_future_effect_reserve_used: false
  candidates: 256
  train_candidates_per_scene: 64
  pair_count_per_scene: 256
  label_schema: independent_wote_labels_4s_six_factor.v2
probe:
  backbone: matched_hybrid_v3
  checkpoint_schema: matched_hybrid_oracle_effect_probe.v3
  direct_initialization_schema: top_aware_direct_scorer.v3
  direct_initialization_representation: hybrid_current
  direct_initialization_objective: O0
  factor_order: [NC, DAC, DDC, EP, TTC, Comfort]
  d_model: 128
  num_heads: 4
  trajectory_layers: 2
  current_cross_attention_layers: 2
  auxiliary_layers: 2
  dropout: 0.0
  candidate_current_feature: [256]
  current_bev_tokens: [64, 256]
  auxiliary_shape: [32, 64]
  residual_effect_adapter_final_init: zero
  exact_direct_initialization: required
  parameter_tolerance: 0
  models:
    - trajectory_only
    - direct_current
    - ego_kinematic_effect
    - static_primitive_effect
    - shared_logged_future
    - dynamic_replay_effect
    - full_primitive_action_effect
    - full_primitive_no_interaction_mask
    - interaction_mask_only
    - full_engineered_action_effect
    - wote_full_future
    - wote_environment_only
pilot:
  train_scenes: 256
  val_scenes: 64
  seed: 0
  learning_rates: [0.0001, 0.0003]
  pairwise_weights: [0.25, 0.5]
  max_epochs: 15
  patience: 3
training:
  optimizer: AdamW
  weight_decay: 0.0001
  batch_scenes: 4
  train_candidates_per_scene: 64
  max_epochs: 25
  patience: 5
  early_stopping_metric: validation_top1_regret
interventions:
  permutation_seed: 20260827
  modes: [full_effect_swap, actor_only_swap, static_only_swap, scene_mean_effect]
bootstrap:
  samples: 5000
  confidence: 0.95
  seed: 20260827
  unit: scene
stopping_scope:
  stop_after: ORACLE_EFFECT_GATE
  forbidden:
    - forward_effect
    - effect_predictor
    - inverse
    - trajectory_refinement
    - policy_distillation
