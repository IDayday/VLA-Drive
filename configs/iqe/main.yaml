  hidden_size: 256
  num_layers: 2
  attention_heads: 4
  dropout: 0.0
  use_expert_identity: false
  cross_candidate_attention: false
  direct_value_head: true
  component_heads: from_metric_schema
  loss_weights: {value: 1.0, components: 1.0, ranking: 0.2}
  huber_delta: 0.1
  rank_temperature: 0.1
  rank_tie_epsilon: 0.01
  replay_old_candidates: true
  sampling: scene_uniform
  warm_start_previous_scorer: true
  lr: 0.0001
  weight_decay: 0.01
  global_scene_batch_size: 128
  micro_batch_size: 128
  max_optimizer_steps: 3000
  warmup_steps: 100
  lr_min_ratio: 0.1
  validation_every_steps: 200
  early_stop_patience: 5
  grad_clip_norm: 1.0
selection:
  type: scorer_base_fallback
  protected_metrics: [no_at_fault_collisions, drivable_area_compliance]
  calibration_split: selector_cal
  sampling: natural_scene_distribution
  delta_grid: [0, 0.01, 0.02, 0.05, 0.10]
  eta_grid: [0, 0.8, 0.9, 0.95, 0.99]
  safety_relative_tolerance: 0.02
  budgets: {false_replacement_rate: 0.05, high_to_zero_rate: 0.0, new_hard_safety_violation_rate: 0.0}
  budget_denominator: all_natural_calibration_scenes
  tie_break: base_then_oldest_id
  atomic_bundle_acceptance: true
router_ablation:
  enabled: false
  hidden_size: 256
  label_type: true_reward_soft_targets
  label_temperature: 0.1
  replay_and_refresh_targets_each_round: true
  run_only_selected_decoder: true
  logit_margin_grid: [0, 0.1, 0.5, 1.0, 2.0]
  probability_margin_grid: [0, 0.01, 0.05, 0.1, 0.2]
gates:
  oracle_min_mean_gain: 0.005
  oracle_min_new_successes: 10
  require_positive_log_bootstrap_lower_bound: true
  require_frozen_parameter_hash_match: true
  minimum_logs_for_ci_gate: 10
  compare_release_against: [s0, previous_serving_bundle]
  require_no_true_safety_regression_for_release: true
execution:
  default_mode: implement_and_smoke
  real_smoke_steps_per_trainer: 32
  smoke_rounds: 2
  auto_full_train: false
  auto_full_labeling: false
  auto_navtest: false
  auto_push: false
  device: cpu
  num_threads: 2
  loader_workers: 2
  max_samples: 128
  cpu_score_workers: 1
  metric_cache_workers: 2
  scientific_expansion: true
  smoke_probe_when_no_gap: false
  tolerate_no_scientific_gain_in_smoke: true
  shared_gpu: false
  checkpoint_every_steps: 200
  bootstrap_repetitions: 2000
  bootstrap_seed: 42
tolerances:
  fp32_cpu: {raw_max_abs: 0.000001, physical_max_abs: 0.00001}
  fp32_cuda: {raw_max_abs: 0.00001, physical_max_abs: 0.0001}
  bf16_cuda: {raw_max_abs: 0.02, physical_max_abs: 0.2}
