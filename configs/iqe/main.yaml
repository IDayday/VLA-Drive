  fixed_target_per_observation_per_round: true
  explicit_anchor_zero: false
  support_limit: 16
expert_train:
  trainable: current_expert_only
  loss: inherit_query_s0_il
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  global_batch_size: 128
  micro_batch_size: 128
  max_optimizer_steps: 3000
  warmup_steps: 100
  lr_min_ratio: 0.1
  grad_clip_norm: 1.0
