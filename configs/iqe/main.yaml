  final_test_read_for_training: false
mining:
  based_on: frozen_candidate_pool
  high_quality: 0.8
  severe_low: 0.6
  target_gain_margin: 0.05
  zero_epsilon: 0.00000001
  require_valid_gt: true
  separate_selection_gap: true
  external_targets_enabled: false
  variant: remaining_pool
