  warmup_steps: 1
  global_batch_size: 4
  micro_batch_size: 1
  validation_every_steps: 16
expert_train:
  max_optimizer_steps: 32
  warmup_steps: 1
  global_batch_size: 4
  micro_batch_size: 4
  validation_every_steps: 16
scorer:
  max_optimizer_steps: 32
  warmup_steps: 1
  global_scene_batch_size: 4
  micro_batch_size: 4
