max_updates: 100000
interface_updates: 1000
aux_warmup_updates: 1000
global_batch: 32
fm_repeat: 1
optimizer:
  name: AdamW
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.01
  gradient_clip: 1.0
  fused: true
learning_rates:
  pretrained_language_merger: 1.0e-05
  pretrained_vision: 1.0e-06
  new_modules: 0.0001
scheduler:
  type: cosine
  warmup_fraction: 0.03
save_every: 1000
dev_every: 5000
loss_weights:
  x: 10.0
  dino: 1.0
  wa_pre: 0.5
  object: 0.1
  future_track: 0.2
  wa_post: 0.25
  evaluation: 0.2
post_scenes_per_update: 8
wa_queries: 128
