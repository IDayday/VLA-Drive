# Reference input for the resolver, not a training launch or model/data config.
# Official YAML says enable_gradient_checkpointing=true, but its selected
# trainer/framework do not consume that flag; the effective value is false.
execution:
  world_size: 8
  micro_batch: 4
  global_batch: 32
  max_updates: 100000
optimizer:
  lr: 1.0e-5
  minimum_lr: 5.0e-7
  warmup: 5000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-3
  clip: 1.0
runtime:
  gradient_checkpointing: false
