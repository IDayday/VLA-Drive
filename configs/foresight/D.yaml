run_id: qwenact
run_root_dir: results/Checkpoints
seed: 42
trackers:
- jsonl
- wandb
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
ver_1225: 1
act_tok: 8
pretrain_model_2d: null
enable_image_aug: 0
w_depth: 0
doing_s2: 0
w_video_latent: 0
vit_pre: 0
rgb_query_loss: 0
gs_query_loss: 0
framework:
  name: DDPForesight
  qwenvl:
    base_vlm: ${oc.env:FORESIGHT_QWEN}
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    device_map: cpu
  action_model:
    action_model_type: DiT-B
    hidden_size: 1536
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 4
    state_dim: 4
    future_action_window_size: 8
    action_horizon: 8
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 1536
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 24
      output_dim: 1536
      positional_embeddings: null
    mlp_head: 0
datasets:
  vla_data:
    load_act_data: true
    act_norm: true
  video_data:
    load_2d_data: false
  gs_data:
    load_3d_data: false
  reward_data:
    load_reward_data: false
trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 200000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    rgb_model: 1.0e-05
    action_model: 1.0e-05
    gs_model: 1.0e-05
    reward_model: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 0.001
  is_resume: false
  resume_ckpt: none
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
from_scratch:
  source_manifest: ${oc.env:FORESIGHT_SOURCES}
foresight:
  arm: D
  num_queries: 64
  lambda_vis: ${oc.env:FORESIGHT_LAMBDA_VIS}
  lambda_int: ${oc.env:FORESIGHT_LAMBDA_INT}
