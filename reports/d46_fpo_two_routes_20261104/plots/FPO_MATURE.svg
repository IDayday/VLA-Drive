<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 810" role="img" aria-labelledby="mature-title"><title id="mature-title">成熟FPO：保持现有算法，继续数据覆盖</title><defs><marker id="mature-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#68839e"/></marker></defs><rect x="95" y="12" width="390" height="78" rx="11" fill="#edf4ff" stroke="#88acd6"/><text x="290.0" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#213952">相同 D IL46 原始父模型</text><text x="290.0" y="59" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4c6077">完整官方 PDMS 89.49552098；同一 SHA</text><polyline points="290,90 290,110" fill="none" stroke="#68839e" stroke-width="1.8" marker-end="url(#mature-arrow)"/><rect x="95" y="112" width="390" height="78" rx="11" fill="#edf4ff" stroke="#88acd6"/><text x="290.0" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#213952">本实验自身 FPO 1711 / inner1 接续</text><text x="290.0" y="159" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4c6077">保留 Adam / scheduler / RNG / 待更新材料</text><polyline points="290,190 290,215" fill="none" stroke="#68839e" stroke-width="1.8" marker-end="url(#mature-arrow)"/><rect x="95" y="217" width="390" height="78" rx="11" fill="#edf4ff" stroke="#88acd6"/><text x="290.0" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#213952">全量 NAVTRAIN → B64 × G16</text><text x="290.0" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4c6077">每 collection 64 个场景、1,024 条新候选</text><polyline points="290,295 290,320" fill="none" stroke="#68839e" stroke-width="1.8" marker-end="url(#mature-arrow)"/><rect x="95" y="322" width="390" height="78" rx="11" fill="#edf4ff" stroke="#88acd6"/><text x="290.0" y="347" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#213952">真实 PDM 评分 → SafetyEP 优势</text><text x="290.0" y="369" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4c6077">组内安全/效率信用；批级 population std</text><polyline points="290,400 290,425" fill="none" stroke="#68839e" stroke-width="1.8" marker-end="url(#mature-arrow)"/><rect x="95" y="427" width="390" height="78" rx="11" fill="#edf4ff" stroke="#88acd6"/><text x="290.0" y="452" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#213952">MC4 CFM energy → FPO clipped 更新</text><text x="290.0" y="474" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4c6077">energy ratio 代理；clip 0.01；每组 M2</text><polyline points="290,505 290,530" fill="none" stroke="#68839e" stroke-width="1.8" marker-end="url(#mature-arrow)"/><rect x="95" y="532" width="390" height="78" rx="11" fill="#f4f6f9" stroke="#abb9c8"/><text x="290.0" y="557" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#213952">FPO + 原 IL46 W3 reference KL</text><text x="290.0" y="579" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4c6077">无新增教师吸收或 B1 历史保持辅助项</text><polyline points="290,610 290,650" fill="none" stroke="#68839e" stroke-width="1.8" marker-end="url(#mature-arrow)"/><rect x="95" y="669" width="390" height="78" rx="11" fill="#f4f6f9" stroke="#abb9c8"/><text x="290.0" y="694" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#213952">部署：仅输出一条 B1 ODE 轨迹</text><text x="290.0" y="716" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4c6077">K10 / shift5 / seed2101；无评分选优</text><text x="290" y="783" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#66788d">验证目标：成熟算法充分训练后能否继续提升</text></svg>