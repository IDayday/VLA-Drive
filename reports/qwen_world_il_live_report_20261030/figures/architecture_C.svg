<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" role="img" aria-labelledby="title-C desc-C"><title id="title-C">C · 独立世界流通过逐层 K/V 帮助动作流</title><desc id="desc-C">W32由20层384宽世界流产生。每层世界状态经分组K/V桥接进入对应actor层，两路attention分开softmax并由gate混合；R训练专用。</desc><defs><marker id="C-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61718d"/></marker><marker id="C-grad" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c34f7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20324e}.h{font-weight:700;font-size:19px}.s{font-size:15px}.note{font-size:15px;fill:#536580}.edge{fill:none;stroke:#61718d;stroke-width:2.2}.aux{stroke:#b87816;stroke-dasharray:7 5}.back{stroke:#c34f7b;stroke-dasharray:4 5}</style><rect width="1280" height="710" rx="18" fill="#fff"/><text x="35" y="38" class="h">C · 独立世界流通过逐层 K/V 帮助动作流</text><text x="35" y="68" class="note">实线：前向数据流　蓝/绿：部署保留　橙：训练专用　紫：共享权重　粉虚线：梯度回传</text><g class="node online"><rect x="30" y="125" width="190" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="125.0" y="154.0" class="h" text-anchor="middle">合法当前输入</text><text x="125.0" y="176.0" class="s" text-anchor="middle">left / front / right</text><text x="125.0" y="198.0" class="s" text-anchor="middle">导航 + ego</text></g><g class="node online"><rect x="260" y="125" width="210" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="365.0" y="154.0" class="h" text-anchor="middle">Qwen3-VL-2B</text><text x="365.0" y="176.0" class="s" text-anchor="middle">选取层 8 / 16 / 28</text><text x="365.0" y="198.0" class="s" text-anchor="middle">merger / 文本表征</text></g><g class="node online"><rect x="510" y="125" width="210" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="615.0" y="154.0" class="h" text-anchor="middle">场景 C160</text><text x="615.0" y="176.0" class="s" text-anchor="middle">144 空间 + 16 全局</text><text x="615.0" y="198.0" class="s" text-anchor="middle">width 1024</text></g><path d="M220 171 H260" class="edge " marker-end="url(#C-arrow)"/><path d="M470 171 H510" class="edge " marker-end="url(#C-arrow)"/><g class="node online"><rect x="830" y="125" width="255" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="957.5" y="154.0" class="h" text-anchor="middle">独立 actor A8</text><text x="957.5" y="176.0" class="s" text-anchor="middle">20 × 1024 / 16 heads</text><text x="957.5" y="198.0" class="s" text-anchor="middle">scene attention 保留</text></g><g class="node out"><rect x="1110" y="125" width="145" height="92" rx="12" fill="#e2f5ef" stroke="#238572" stroke-width="1.7"/><text x="1182.5" y="165.0" class="h" text-anchor="middle">8 × 3 轨迹</text><text x="1182.5" y="187.0" class="s" text-anchor="middle">K10 shift5</text></g><path d="M720 171 H830" class="edge " marker-end="url(#C-arrow)"/><path d="M1085 171 H1110" class="edge " marker-end="url(#C-arrow)"/><g class="node online"><rect x="320" y="330" width="270" height="104" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="455.0" y="365.0" class="h" text-anchor="middle">在线世界 W32</text><text x="455.0" y="387.0" class="s" text-anchor="middle">20 × 384 / 6 heads</text><text x="455.0" y="409.0" class="s" text-anchor="middle">仅读取当前 C160</text></g><g class="node online"><rect x="650" y="330" width="270" height="104" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="785.0" y="365.0" class="h" text-anchor="middle">逐层 world → actor K/V</text><text x="785.0" y="387.0" class="s" text-anchor="middle">20 层一一对应；4 组桥接</text><text x="785.0" y="409.0" class="s" text-anchor="middle">复用 actor 的 Q / O</text></g><path d="M565 217 V275 H455 V330" class="edge " marker-end="url(#C-arrow)"/><path d="M590 382 H650" class="edge " marker-end="url(#C-arrow)"/><path d="M920 382 H975 V217" class="edge " marker-end="url(#C-arrow)"/><text x="960" y="303" class="note">每层主动读取</text><text x="40" y="290" class="h">两路独立 softmax：Attn(C) + tanh(g) × Attn(W)</text><g class="node train"><rect x="650" y="490" width="270" height="80" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="785.0" y="524.0" class="h" text-anchor="middle">训练专用 R16</text><text x="785.0" y="546.0" class="s" text-anchor="middle">复用世界流 + actor hidden</text></g><g class="node train"><rect x="975" y="490" width="280" height="80" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="1115.0" y="524.0" class="h" text-anchor="middle">后置辅助读出</text><text x="1115.0" y="546.0" class="s" text-anchor="middle">事实未来 / 候选分数与事件</text></g><path d="M455 434 V530 H650" class="edge aux" marker-end="url(#C-arrow)"/><path d="M1050 217 V460 H785 V490" class="edge aux" marker-end="url(#C-arrow)"/><path d="M920 530 H975" class="edge aux" marker-end="url(#C-arrow)"/><path d="M1115 570 V596 H945 V434" class="edge back" marker-end="url(#C-grad)"/><line x1="35" y1="622" x2="1245" y2="622" stroke="#dce3ef"/><text x="35" y="650" class="note">部署保留 W32 和 world→actor 桥接；只删除 R 专用 query、actor→R 桥接与 readout。</text><text x="35" y="674" class="note">W 不读候选动作或 flow sigma；R 的动作后信息不会流回同次 W / actor 前向。</text></svg>