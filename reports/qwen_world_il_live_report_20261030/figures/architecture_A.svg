<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" role="img" aria-labelledby="title-A desc-A"><title id="title-A">A · 世界能力在训练中内化，部署删除世界分支</title><desc id="desc-A">Actor只读取C160。W32/R16属于共享紧凑世界分支，只在训练中运行。后置损失经未detach的候选actor hidden回传，但没有W到actor的在线连接。</desc><defs><marker id="A-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61718d"/></marker><marker id="A-grad" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c34f7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20324e}.h{font-weight:700;font-size:19px}.s{font-size:15px}.note{font-size:15px;fill:#536580}.edge{fill:none;stroke:#61718d;stroke-width:2.2}.aux{stroke:#b87816;stroke-dasharray:7 5}.back{stroke:#c34f7b;stroke-dasharray:4 5}</style><rect width="1280" height="710" rx="18" fill="#fff"/><text x="35" y="38" class="h">A · 世界能力在训练中内化，部署删除世界分支</text><text x="35" y="68" class="note">实线：前向数据流　蓝/绿：部署保留　橙：训练专用　紫：共享权重　粉虚线：梯度回传</text><g class="node online"><rect x="30" y="125" width="190" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="125.0" y="154.0" class="h" text-anchor="middle">合法当前输入</text><text x="125.0" y="176.0" class="s" text-anchor="middle">left / front / right</text><text x="125.0" y="198.0" class="s" text-anchor="middle">导航 + ego</text></g><g class="node online"><rect x="260" y="125" width="210" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="365.0" y="154.0" class="h" text-anchor="middle">Qwen3-VL-2B</text><text x="365.0" y="176.0" class="s" text-anchor="middle">选取层 8 / 16 / 28</text><text x="365.0" y="198.0" class="s" text-anchor="middle">merger / 文本表征</text></g><g class="node online"><rect x="510" y="125" width="210" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="615.0" y="154.0" class="h" text-anchor="middle">场景 C160</text><text x="615.0" y="176.0" class="s" text-anchor="middle">144 空间 + 16 全局</text><text x="615.0" y="198.0" class="s" text-anchor="middle">width 1024</text></g><path d="M220 171 H260" class="edge " marker-end="url(#A-arrow)"/><path d="M470 171 H510" class="edge " marker-end="url(#A-arrow)"/><g class="node online"><rect x="805" y="125" width="245" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="927.5" y="154.0" class="h" text-anchor="middle">独立 actor A8</text><text x="927.5" y="176.0" class="s" text-anchor="middle">20 × 1024 / 16 heads</text><text x="927.5" y="198.0" class="s" text-anchor="middle">只读取 C160</text></g><g class="node out"><rect x="1080" y="125" width="170" height="92" rx="12" fill="#e2f5ef" stroke="#238572" stroke-width="1.7"/><text x="1165.0" y="165.0" class="h" text-anchor="middle">8 × 3 轨迹</text><text x="1165.0" y="187.0" class="s" text-anchor="middle">K10 / shift5</text></g><path d="M720 171 H805" class="edge " marker-end="url(#A-arrow)"/><path d="M1050 171 H1080" class="edge " marker-end="url(#A-arrow)"/><g class="node train"><rect x="335" y="315" width="280" height="100" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="475.0" y="348.0" class="h" text-anchor="middle">训练专用 WorldStream</text><text x="475.0" y="370.0" class="s" text-anchor="middle">W32 · 20 × 384 / 6 heads</text><text x="475.0" y="392.0" class="s" text-anchor="middle">预任务：DINO / WA / tracks</text></g><g class="node train"><rect x="745" y="315" width="305" height="100" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="897.5" y="348.0" class="h" text-anchor="middle">训练专用 R16</text><text x="897.5" y="370.0" class="s" text-anchor="middle">与 W 复用 WorldStream 权重</text><text x="897.5" y="392.0" class="s" text-anchor="middle">读取逐层 candidate actor hidden</text></g><path d="M565 217 V270 H475 V315" class="edge aux" marker-end="url(#A-arrow)"/><path d="M615 365 H745" class="edge aux" marker-end="url(#A-arrow)"/><path d="M925 217 V315" class="edge 