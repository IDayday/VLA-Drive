<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" role="img" aria-labelledby="title-B desc-B"><title id="title-B">B · P / A / R 共用一个决策 Transformer</title><desc id="desc-B">P32、A8和R16复用20层1024宽主干。P不接收动作或sigma；A读取P；R读取同一候选的A，不能被P或A读取。</desc><defs><marker id="B-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61718d"/></marker><marker id="B-grad" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c34f7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20324e}.h{font-weight:700;font-size:19px}.s{font-size:15px}.note{font-size:15px;fill:#536580}.edge{fill:none;stroke:#61718d;stroke-width:2.2}.aux{stroke:#b87816;stroke-dasharray:7 5}.back{stroke:#c34f7b;stroke-dasharray:4 5}</style><rect width="1280" height="710" rx="18" fill="#fff"/><text x="35" y="38" class="h">B · P / A / R 共用一个决策 Transformer</text><text x="35" y="68" class="note">实线：前向数据流　蓝/绿：部署保留　橙：训练专用　紫：共享权重　粉虚线：梯度回传</text><g class="node online"><rect x="30" y="125" width="190" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="125.0" y="154.0" class="h" text-anchor="middle">合法当前输入</text><text x="125.0" y="176.0" class="s" text-anchor="middle">left / front / right</text><text x="125.0" y="198.0" class="s" text-anchor="middle">导航 + ego</text></g><g class="node online"><rect x="260" y="125" width="210" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="365.0" y="154.0" class="h" text-anchor="middle">Qwen3-VL-2B</text><text x="365.0" y="176.0" class="s" text-anchor="middle">选取层 8 / 16 / 28</text><text x="365.0" y="198.0" class="s" text-anchor="middle">merger / 文本表征</text></g><g class="node online"><rect x="510" y="125" width="210" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="615.0" y="154.0" class="h" text-anchor="middle">场景 C160</text><text x="615.0" y="176.0" class="s" text-anchor="middle">144 空间 + 16 全局</text><text x="615.0" y="198.0" class="s" text-anchor="middle">width 1024</text></g><path d="M220 171 H260" class="edge " marker-end="url(#B-arrow)"/><path d="M470 171 H510" class="edge " marker-end="url(#B-arrow)"/><rect x="180" y="278" width="1010" height="295" rx="16" fill="#faf8ff" stroke="#7859b5" stroke-width="2"/><text x="210" y="311" class="h">同一个 20 × 1024 决策主干：Q/K/V/O、FFN、主要调制共享</text><g class="node shared"><rect x="220" y="345" width="235" height="104" rx="12" fill="#f0eaff" stroke="#7859b5" stroke-width="1.7"/><text x="337.5" y="380.0" class="h" text-anchor="middle">P32：动作前</text><text x="337.5" y="402.0" class="s" text-anchor="middle">固定时间 / 仅 C + P</text><text x="337.5" y="424.0" class="s" text-anchor="middle">每场景一次 prefix</text></g><g class="node shared"><rect x="560" y="345" width="235" height="104" rx="12" fill="#f0eaff" stroke="#7859b5" stroke-width="1.7"/><text x="677.5" y="380.0" class="h" text-anchor="middle">A8：动作生成</text><text x="677.5" y="402.0" class="s" text-anchor="middle">读取 C / P / A</text><text x="677.5" y="424.0" class="s" text-anchor="middle">sigma 条件，10 次去噪</text></g><g class="node train"><rect x="900" y="345" width="245" height="104" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="1022.5" y="380.0" class="h" text-anchor="middle">R16：动作后</text><text x="1022.5" y="402.0" class="s" text-anchor="middle">读取 C / P / 当前候选 A / R</text><text x="1022.5" y="424.0" class="s" text-anchor="middle">sigma=0，训练专用</text></g><path d="M615 217 V252 H337 V345" class="edge " marker-end="url(#B-arrow)"/><path d="M615 252 H677 V345" class="edge " marker-end="url(#B-arrow)"/><path d="M677 252 H1022 V345" class="edge " marker-end="url(#B-arrow)"/><path d="M455 397 H560" class="edge " marker-end="url(#B-arrow)"/><path d="M795 397 H900" class="edge " marker-end="url(#B-arrow)"/><path d="M337 449 V486 H1022 V449" class="edge aux" marker-end="url(#B-arrow)"/><g class="node out"><rect x="545" y="500" width="270" height="60" rx="12" fill="#e2f5ef" stroke="#238572" stroke-width="1.7"/><text x="680.0" y="535.0" class="h" text-anchor="middle">连续 action_output → 8 × 3</text></g><path d="M677 449 V500" class="edge " marker-end="url(#B-arrow)"/><text x="890" y="529" class="h">R → P/A：禁止</text><line x1="35" y1="622" x2="1245" y2="622" stroke="#dce3ef"/><text x="35" y="650" class="note">P/A/R 不是三套 Transformer；方向性 mask 使删除 R 不改变动作前向。</text><text x="35" y="674" class="note">RL 的共享 LoRA 会改变 P，故每次 inner 当前前缀必须带梯度重建；部署保留 P + 共享 actor。</text></svg>