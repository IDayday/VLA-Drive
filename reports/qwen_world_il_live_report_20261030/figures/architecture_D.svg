<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" role="img" aria-labelledby="title-D desc-D"><title id="title-D">D · Qwen 语言层直接承担连续动作生成</title><desc id="desc-D">Qwen3-VL原生28层2048宽文本主干同时处理当前C、P32、A8及训练R16。视觉DeepStack只注入当前图像位置。动作FiLM只作用于A，动作不是文本自回归。</desc><defs><marker id="D-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61718d"/></marker><marker id="D-grad" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c34f7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20324e}.h{font-weight:700;font-size:19px}.s{font-size:15px}.note{font-size:15px;fill:#536580}.edge{fill:none;stroke:#61718d;stroke-width:2.2}.aux{stroke:#b87816;stroke-dasharray:7 5}.back{stroke:#c34f7b;stroke-dasharray:4 5}</style><rect width="1280" height="710" rx="18" fill="#fff"/><text x="35" y="38" class="h">D · Qwen 语言层直接承担连续动作生成</text><text x="35" y="68" class="note">实线：前向数据流　蓝/绿：部署保留　橙：训练专用　紫：共享权重　粉虚线：梯度回传</text><g class="node online"><rect x="30" y="122" width="260" height="90" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="160.0" y="150.0" class="h" text-anchor="middle">当前三视图 / 导航 / ego</text><text x="160.0" y="172.0" class="s" text-anchor="middle">官方 processor / mRoPE</text><text x="160.0" y="194.0" class="s" text-anchor="middle">视觉 merger + DeepStack</text></g><rect x="330" y="110" width="910" height="430" rx="16" fill="#faf8ff" stroke="#7859b5" stroke-width="2"/><text x="360" y="143" class="h">同一个原生 Qwen 文本主干：28 层 × 2048，GQA / RMSNorm / mRoPE 保留</text><g class="node shared"><rect x="365" y="180" width="235" height="90" rx="12" fill="#f0eaff" stroke="#7859b5" stroke-width="1.7"/><text x="482.5" y="208.0" class="h" text-anchor="middle">当前 C prefill</text><text x="482.5" y="230.0" class="s" text-anchor="middle">DeepStack 只注入图像位置</text><text x="482.5" y="252.0" class="s" text-anchor="middle">保持当前输入关系</text></g><g class="node shared"><rect x="665" y="180" width="220" height="90" rx="12" fill="#f0eaff" stroke="#7859b5" stroke-width="1.7"/><text x="775.0" y="208.0" class="h" text-anchor="middle">P32 prefill</text><text x="775.0" y="230.0" class="s" text-anchor="middle">读取 C / P</text><text x="775.0" y="252.0" class="s" text-anchor="middle">动作无关 prefix</text></g><g class="node shared"><rect x="665" y="340" width="220" height="100" rx="12" fill="#f0eaff" stroke="#7859b5" stroke-width="1.7"/><text x="775.0" y="373.0" class="h" text-anchor="middle">A8 连续动作</text><text x="775.0" y="395.0" class="s" text-anchor="middle">读取 C / P / A</text><text x="775.0" y="417.0" class="s" text-anchor="middle">块内双向，非逐点自回归</text></g><g class="node train"><rect x="955" y="340" width="245" height="100" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="1077.5" y="373.0" class="h" text-anchor="middle">R16：训练专用</text><text x="1077.5" y="395.0" class="s" text-anchor="middle">读取 C / P / 候选 A / R</text><text x="1077.5" y="417.0" class="s" text-anchor="middle">共享同一语言层</text></g><path d="M290 167 H315 V225 H365" class="edge " marker-end="url(#D-arrow)"/><path d="M600 225 H665" class="edge " marker-end="url(#D-arrow)"/><path d="M775 270 V340" class="edge " marker-end="url(#D-arrow)"/><path d="M885 390 H955" class="edge " marker-end="url(#D-arrow)"/><g class="node online"><rect x="30" y="350" width="260" height="90" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="160.0" y="378.0" class="h" text-anchor="middle">连续动作 + 时间接口</text><text x="160.0" y="400.0" class="s" text-anchor="middle">action_input 3 → 2048</text><text x="160.0" y="422.0" class="s" text-anchor="middle">time 256 → 逐层 FiLM</text></g><path d="M290 395 H665" class="edge " marker-end="url(#D-arrow)"/><text x="330" y="378" class="note">FiLM 只作用 A；不调制 C / P</text><g class="node out"><rect x="665" y="560" width="235" height="55" rx="12" fill="#e2f5ef" stroke="#238572" stroke-width="1.7"/><text x="782.5" y="592.5" class="h" text-anchor="middle">action_output 2048 → 3</text></g><path d="M775 440 V560" class="edge " marker-end="url(#D-arrow)"/><text x="365" y="495" class="note">每步从相同 C+P cache 开始；不累积上一步 A 的 KV。</text><g class="node train"><rect x="975" y="560" width="245" height="55" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="1097.5" y="592.5" class="h" text-anchor="middle">后置任务 readout</text></g><path d="M1077 440 V560" class="edge aux" marker-end="url(#D-arrow)"/><line x1="35" y1="622" x2="1245" y2="622" stroke="#dce3ef"/><text x="35" y="650" class="note">没有独立 500M actor；动作去噪实际使用 Qwen 语言层，不能把“少一个模块”解释为计算更小。</text><text x="35" y="674" class="note">RL 文本 attention LoRA 也改变 C/P；每个 inner 重建当前文本前缀，冻结视觉/merger 可以缓存。</text></svg>