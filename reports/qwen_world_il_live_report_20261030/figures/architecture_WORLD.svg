<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" role="img" aria-labelledby="title-WORLD desc-WORLD"><title id="title-WORLD">当前 Qwen-World：场景 / predictive memory + 独立 actor</title><desc id="desc-WORLD">当前三视图、导航与合法ego经Qwen、C160和predictive32进入独立20层actor。训练辅助读出删除；predictive32部署保留。</desc><defs><marker id="WORLD-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61718d"/></marker><marker id="WORLD-grad" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c34f7b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20324e}.h{font-weight:700;font-size:19px}.s{font-size:15px}.note{font-size:15px;fill:#536580}.edge{fill:none;stroke:#61718d;stroke-width:2.2}.aux{stroke:#b87816;stroke-dasharray:7 5}.back{stroke:#c34f7b;stroke-dasharray:4 5}</style><rect width="1280" height="710" rx="18" fill="#fff"/><text x="35" y="38" class="h">当前 Qwen-World：场景 / predictive memory + 独立 actor</text><text x="35" y="68" class="note">实线：前向数据流　蓝/绿：部署保留　橙：训练专用　紫：共享权重　粉虚线：梯度回传</text><g class="node online"><rect x="30" y="125" width="190" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="125.0" y="154.0" class="h" text-anchor="middle">合法当前输入</text><text x="125.0" y="176.0" class="s" text-anchor="middle">left / front / right</text><text x="125.0" y="198.0" class="s" text-anchor="middle">导航 + ego</text></g><g class="node online"><rect x="260" y="125" width="210" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="365.0" y="154.0" class="h" text-anchor="middle">Qwen3-VL-2B</text><text x="365.0" y="176.0" class="s" text-anchor="middle">选取层 8 / 16 / 28</text><text x="365.0" y="198.0" class="s" text-anchor="middle">merger / 文本表征</text></g><g class="node online"><rect x="510" y="125" width="210" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="615.0" y="154.0" class="h" text-anchor="middle">场景 C160</text><text x="615.0" y="176.0" class="s" text-anchor="middle">144 空间 + 16 全局</text><text x="615.0" y="198.0" class="s" text-anchor="middle">width 1024</text></g><path d="M220 171 H260" class="edge " marker-end="url(#WORLD-arrow)"/><path d="M470 171 H510" class="edge " marker-end="url(#WORLD-arrow)"/><g class="node online"><rect x="770" y="125" width="215" height="92" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="877.5" y="154.0" class="h" text-anchor="middle">Predictive P32</text><text x="877.5" y="176.0" class="s" text-anchor="middle">2 层 / 内宽 512</text><text x="877.5" y="198.0" class="s" text-anchor="middle">仅观察条件的未来表征</text></g><g class="node online"><rect x="760" y="285" width="240" height="102" rx="12" fill="#e8f1ff" stroke="#376ac7" stroke-width="1.7"/><text x="880.0" y="319.0" class="h" text-anchor="middle">独立 clean-x actor</text><text x="880.0" y="341.0" class="s" text-anchor="middle">20 × 1024 / 16 heads</text><text x="880.0" y="363.0" class="s" text-anchor="middle">读取 C160 + P32</text></g><g class="node out"><rect x="1040" y="290" width="205" height="92" rx="12" fill="#e2f5ef" stroke="#238572" stroke-width="1.7"/><text x="1142.5" y="319.0" class="h" text-anchor="middle">单轨输出</text><text x="1142.5" y="341.0" class="s" text-anchor="middle">8 × [x, y, heading]</text><text x="1142.5" y="363.0" class="s" text-anchor="middle">10 步 shift5 ODE</text></g><path d="M720 171 H770" class="edge " marker-end="url(#WORLD-arrow)"/><path d="M615 217 V336 H760" class="edge " marker-end="url(#WORLD-arrow)"/><path d="M875 217 V285" class="edge " marker-end="url(#WORLD-arrow)"/><path d="M1000 336 H1040" class="edge " marker-end="url(#WORLD-arrow)"/><g class="node train"><rect x="285" y="300" width="235" height="80" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="402.5" y="334.0" class="h" text-anchor="middle">当前辅助读出</text><text x="402.5" y="356.0" class="s" text-anchor="middle">DINO / 当前对象</text></g><g class="node train"><rect x="1020" y="125" width="230" height="92" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="1135.0" y="154.0" class="h" text-anchor="middle">未来 WA 辅助读出</text><text x="1135.0" y="176.0" class="s" text-anchor="middle">真实未来仅作标签</text><text x="1135.0" y="198.0" class="s" text-anchor="middle">不作为 actor 输入</text></g><path d="M565 217 V255 H402 V300" class="edge aux" marker-end="url(#WORLD-arrow)"/><path d="M985 171 H1020" class="edge aux" marker-end="url(#WORLD-arrow)"/><g class="node train"><rect x="30" y="475" width="285" height="92" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="172.5" y="504.0" class="h" text-anchor="middle">精确训练候选</text><text x="172.5" y="526.0" class="s" text-anchor="middle">GT / 已评分候选轨迹</text><text x="172.5" y="548.0" class="s" text-anchor="middle">不是部署时的多候选筛选</text></g><g class="node train"><rect x="365" y="475" width="300" height="92" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="515.0" y="504.0" class="h" text-anchor="middle">同一 actor clean replay</text><text x="515.0" y="526.0" class="s" text-anchor="middle">sigma = 0 → candidate hidden</text><text x="515.0" y="548.0" class="s" text-anchor="middle">复用上方 actor 权重</text></g><g class="node train"><rect x="760" y="475" width="330" height="92" rx="12" fill="#fff3df" stroke="#b87816" stroke-width="1.7"/><text x="925.0" y="504.0" class="h" text-anchor="middle">动作后六小分 readout</text><text x="925.0" y="526.0" class="s" text-anchor="middle">NC / DAC / TTC / EP / Comfort / DDC</text><text x="925.0" y="548.0" class="s" text-anchor="middle">训练后果表示，不输出修复量</text></g><path d="M315 521 H365" class="edge aux" marker-end="url(#WORLD-arrow)"/><path d="M665 521 H760" class="edge aux" marker-end="url(#WORLD-arrow)"/><path d="M920 475 V429 H880 V387" class="edge back" marker-end="url(#WORLD-grad)"/><text x="945" y="431" class="note">后置梯度到 actor / memory / Qwen</text><line x1="35" y1="622" x2="1245" y2="622" stroke="#dce3ef"/><text x="35" y="650" class="note">部署保留 predictive32；删除四类辅助 readout、teacher、候选库和 scorer。</text><text x="35" y="674" class="note">post loss 经 actor hidden 回传，不要求经过最后 action_output；候选不是部署动作的 GT 选轨。</text></svg>