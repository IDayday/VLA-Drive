output_dir: ./runs/grpo/RESOLVED_TIME_NOT_A_HYPERPARAMETER
batch_size: 1
num_workers: 8
lr_scheduler_type: constant
learning_rate: 5.0e-05
lr_warmup_steps: 100
num_epochs: 1000000
max_steps: 20000
log_every: 5
save_every: 500
eval_every: 100
gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
resume: null
grpo:
  target: action
  sample:
    group_size: 8
    num_inference_steps: 10
    infer_shift: null
    sample_noise_std: 0.1
    logprob_noise_std: null
    anneal_noise: true
    min_std: 0.001
    randn_clip: 5.0
    logprob_clamp_mode: relative
    logprob_clamp_width: 7.0
    final_action_clip: null
    sde_mode: rigorous
    noise_level: 0.1
    train_sde_steps: 3
    sde_exclude_last_step: false
    sde_step_indices: null
    merge_sde_window: false
  train:
    denoising_discount: 1.0
    adv_clip_lower_quantile: 0.0
    adv_clip_upper_quantile: 1.0
    adv_eps: 1.0e-08
    adv_global_std: true
    drop_zero_adv: true
    use_bc_loss: false
    bc_coeff: 0.1
    kl_beta: 50
    kl_type: x
    kl_dim_weights:
    - 0.2
    - 1.0
    - 1.0
    kl_horizon_weights: null
    ppo_clip_range: 0.005
    adv_clip_max: 5.0
    num_inner_epochs: 4
    rollout_buffer_batches: 1
    kl_gate:
      enabled: false
      delta: 0.0001
      asymmetric: false
  lora:
    enabled: true
    r: 16
    alpha: 32.0
    dropout: 0.0
    target_modules:
    - q
    - k
    - v
    - o
  reward:
    name: pdm
    metric_cache_path: ./data/metric_cache_navtrain
    proposal_time_horizon: 4.0
    proposal_interval: 0.1
    model_trajectory_interval: 0.5
    progress_weight: 10.0
    ttc_weight: 5.0
    comfortable_weight: 2.0
  eval:
    enabled: true
    num_batches: 8
  vis:
    enabled: true
    every: 100
    num_conditions: 2
    max_samples: 0
    plot_mode: bev_camera
    dpi: 150
wandb:
  enabled: false
  workspace: null
  project: simple-wam
  name: navsim_grpo
  group: null
  mode: online
data:
  train:
    _target_: simwam.datasets.navsim.navsim_dataset.NavSimVideoDataset
    navsim_log_path: SOURCE_NAVTRAIN_LOGS
    sensor_blobs_path: SOURCE_NAVTRAIN_SENSORS
    scene_filter: /mnt/project/simwam-recipe-20261015/upstream/SimWAM/navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtrain_pdm_score_below0p9.yaml
    split_config_path: /mnt/project/simwam-recipe-20261015/upstream/SimWAM/navsim/navsim/planning/script/config/training/default_train_val_test_log_split.yaml
    split_logs_key: train_logs
    num_frames: 9
    future_action_horizon: 8
    frame_stride: 1
    video_frame_mode: current_plus_future
    video_size:
    - 384
    - 672
    camera_layout: front
    is_training_set: true
    text_embedding_cache_dir: ./data/text_embeds_cache/navsim
    context_len: 256
    action_dim: 3
    state_dim: 8
    use_dynamic_prompt: false
    use_current_frame_prompt: false
    trajectory_mode: absolute
    proprio_dim: 8
    normalize_action: true
    pretrained_norm_stats: ./data/navsim_dataset_stats.json
    stats_cache_path: ./data/navsim_dataset_stats.json
model:
  _target_: simwam.runtime_grpo.create_simwam_grpo
  model_id: Wan-AI/Wan2.2-TI2V-5B
  tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
  tokenizer_max_len: 128
  load_text_encoder: false
  proprio_dim: 8
  redirect_common_files: true
  mot_checkpoint_mixed_attn: false
  mot_attention_mask_mode: isolated
  action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim_3outdim.pt
  skip_dit_load_from_pretrain: false
  video_dit_config:
    has_image_input: false
    patch_size:
    - 1
    - 2
    - 2
    in_dim: 48
    hidden_dim: 3072
    ffn_dim: 14336
    freq_dim: 256
    text_dim: 4096
    out_dim: 48
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    eps: 1.0e-06
    seperated_timestep: true
    require_clip_embedding: false
    require_vae_embedding: false
    fuse_vae_embedding_in_latents: true
    use_gradient_checkpointing: false
    video_attention_mask_mode: first_frame_causal
    action_conditioned: false
    action_dim: 3
    action_group_causal_mask_mode: group_diagonal
  action_dit_config:
    action_dim: 3
    hidden_dim: 1024
    ffn_dim: 4096
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    use_gradient_checkpointing: false
  video_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
    prediction_type: velocity
    sigma_clamp_min: 0.1
  loss:
    lambda_action: 1.0
  checkpoint_path: ./weights/SimWAM.pt
